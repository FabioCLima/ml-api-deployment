name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: Test & Quality Checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r chapter13/complete/requirements.txt
        pip install pytest pytest-cov flake8 black bandit

    - name: Run Black (Code Formatting Check)
      run: |
        black --check --diff api/ chapter13/ chapter14/ || true

    - name: Run Flake8 (Linting)
      run: |
        flake8 api/ chapter13/ chapter14/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 api/ chapter13/ chapter14/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Bandit (Security Check)
      run: |
        bandit -r api/ chapter13/ chapter14/ -f json -o bandit-report.json || true
        bandit -r api/ chapter13/ chapter14/ || true

    - name: Run Tests with Coverage
      run: |
        pytest api/ --cov=api --cov-report=xml --cov-report=term-missing

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
