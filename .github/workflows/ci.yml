name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: Test & Quality Checks
    runs-on: ubuntu-latest

    steps:
    # PASSO 1: Baixar o código do repositório
    - name: Checkout code
      uses: actions/checkout@v4

    # PASSO 2: Configurar Python 3.11 (versão definida em .python-version)
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # PASSO 3: Instalar UV (gerenciador de pacotes rápido)
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    # PASSO 4: Criar ambiente virtual e instalar dependências
    - name: Install dependencies
      run: |
        uv venv
        source .venv/bin/activate
        uv pip install -r chapter13/complete/requirements.txt
        uv pip install pytest pytest-cov mypy ruff

    # PASSO 5: Ruff - Verificar formatação (substitui black)
    - name: Check code formatting with Ruff
      run: |
        source .venv/bin/activate
        ruff format --check api/ chapter13/ chapter14/

    # PASSO 6: Ruff - Linting (substitui flake8)
    - name: Run Ruff linting
      run: |
        source .venv/bin/activate
        ruff check api/ chapter13/ chapter14/

    # PASSO 7: MyPy - Type checking (verificação de tipos)
    - name: Run MyPy type checking
      run: |
        source .venv/bin/activate
        mypy api/ || true

    # PASSO 8: Pytest - Rodar testes (OBRIGATÓRIO PASSAR)
    - name: Run tests with pytest
      run: |
        source .venv/bin/activate
        pytest api/ --cov=api --cov-report=xml --cov-report=term-missing

    # PASSO 9: Upload de cobertura de código (opcional)
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
